<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculador Bidireccional: Posición Horaria ➔ mm</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --watermark: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      margin: 0;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      max-width: 520px;
      width: 100%;
      position: relative;
    }
    h2 {
      margin: 0 0 16px 0;
      color: var(--primary);
      font-size: 1.25rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin: 14px 0 8px 0;
      letter-spacing: 0.05em;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      background: #fff;
    }
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    /* Contenedor Stepper táctil */
    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .stepper input {
      flex: 1;
      border: none;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 10px 0;
      width: 100%;
      box-sizing: border-box;
      color: var(--text);
      -moz-appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .stepper input:focus {
      outline: none;
    }
    .btn-step {
      background: #f1f5f9;
      border: none;
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 700;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .btn-step:hover {
      background: #e2e8f0;
    }
    .btn-step:active {
      background: #cbd5e1;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .results {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 16px;
      border-left: 4px solid var(--accent);
    }
    .results p {
      margin: 6px 0;
      font-size: 0.92rem;
    }
    .results strong {
      color: var(--primary);
      font-size: 1rem;
    }
    .pipe-view {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }
    .ref-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #475569;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .watermark {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
      font-size: 0.78rem;
      color: var(--watermark);
      text-align: left;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Conversor Horario ⇄ Longitud de Arco</h2>

  <div class="field">
    <label for="nps">Diámetro Nominal (NPS):</label>
    <select id="nps" onchange="onPipeChange()">
      <option value="4">4" (OD: 114.3 mm)</option>
      <option value="6">6" (OD: 168.3 mm)</option>
      <option value="8">8" (OD: 219.1 mm)</option>
      <option value="10">10" (OD: 273.1 mm)</option>
      <option value="12">12" (OD: 323.8 mm)</option>
      <option value="16">16" (OD: 406.4 mm)</option>
      <option value="18">18" (OD: 457.2 mm)</option>
      <option value="20">20" (OD: 508.0 mm)</option>
      <option value="22">22" (OD: 558.8 mm)</option>
      <option value="24" selected>24" (OD: 609.6 mm)</option>
      <option value="30">30" (OD: 762.0 mm)</option>
      <option value="36">36" (OD: 914.4 mm)</option>
      <option value="42">42" (OD: 1066.8 mm)</option>
      <option value="48">48" (OD: 1219.2 mm)</option>
      <option value="custom">Personalizado (ingresar OD)...</option>
    </select>
  </div>

  <div class="field" id="custom-od-box" style="display: none;">
    <label for="custom-od">Diámetro Exterior Real (OD en mm):</label>
    <div class="stepper">
      <button class="btn-step" onclick="stepVal('custom-od', -10, onPipeChange)">−</button>
      <input type="number" id="custom-od" value="609.6" step="0.1" oninput="onPipeChange()">
      <button class="btn-step" onclick="stepVal('custom-od', 10, onPipeChange)">+</button>
    </div>
  </div>

  <div class="section-title">Entrada 1: Por Posición Horaria</div>
  <div class="row">
    <div class="field" style="flex: 1;">
      <label for="hours">Hora (0 - 12):</label>
      <div class="stepper">
        <button class="btn-step" onclick="stepHour(-1)">−</button>
        <input type="number" id="hours" min="0" max="12" value="3" oninput="calcFromClock()">
        <button class="btn-step" onclick="stepHour(1)">+</button>
      </div>
    </div>
    <div class="field" style="flex: 1;">
      <label for="minutes">Minutos (0 - 59):</label>
      <div class="stepper">
        <button class="btn-step" onclick="stepMin(-5)">−</button>
        <input type="number" id="minutes" min="0" max="59" value="0" oninput="calcFromClock()">
        <button class="btn-step" onclick="stepMin(5)">+</button>
      </div>
    </div>
  </div>

  <div class="section-title">Entrada 2: Por Distancia de Arco Acumulada</div>
  <div class="field">
    <label for="arc-input">Longitud en mm (sentido horario desde 12:00):</label>
    <div class="stepper">
      <button class="btn-step" onclick="stepArc(-10)">−</button>
      <input type="number" id="arc-input" step="0.1" placeholder="Ej: 478.8" oninput="calcFromArc()">
      <button class="btn-step" onclick="stepArc(10)">+</button>
    </div>
  </div>

  <div class="results">
    <p>Posición horaria formateada: <strong id="lbl-clock">03:00</strong></p>
    <p>Ángulo de giro (θ): <strong id="lbl-deg">90.0°</strong></p>
    <p>Longitud de arco acumulada: <strong id="lbl-arc">478.78 mm</strong></p>
    <p>Perímetro total de la sección: <strong id="lbl-perim">1915.11 mm</strong></p>
  </div>

  <div class="pipe-view">
    <svg width="260" height="260" viewBox="0 0 260 260">
      <text x="130" y="16" class="ref-label">0-12</text>
      <text x="242" y="130" class="ref-label">03</text>
      <text x="130" y="244" class="ref-label">06</text>
      <text x="18" y="130" class="ref-label">09</text>

      <circle cx="130" cy="130" r="82" stroke="#0284c7" stroke-width="12" fill="#f8fafc" />

      <line x1="130" y1="40" x2="130" y2="54" stroke="#64748b" stroke-width="2" />
      <line x1="130" y1="206" x2="130" y2="220" stroke="#64748b" stroke-width="2" />
      <line x1="40" y1="130" x2="54" y1="130" stroke="#64748b" stroke-width="2" />
      <line x1="206" y1="130" x2="220" y2="130" stroke="#64748b" stroke-width="2" />

      <line id="needle" x1="130" y1="130" x2="212" y2="130" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <circle cx="130" cy="130" r="4.5" fill="#0f172a" />
    </svg>
  </div>

  <div class="watermark">
    Autor: Emmanuel Benitez
  </div>
</div>

<script>
  const npsODMap = {
    "4": 114.3, "6": 168.3, "8": 219.1, "10": 273.1,
    "12": 323.8, "16": 406.4, "18": 457.2, "20": 508.0, 
    "22": 558.8, "24": 609.6, "30": 762.0, "36": 914.4, 
    "42": 1066.8, "48": 1219.2
  };

  function getOD() {
    const sel = document.getElementById("nps").value;
    return (sel === "custom") 
      ? (parseFloat(document.getElementById("custom-od").value) || 0)
      : npsODMap[sel];
  }

  function onPipeChange() {
    const sel = document.getElementById("nps").value;
    const box = document.getElementById("custom-od-box");
    box.style.display = (sel === "custom") ? "block" : "none";
    if (sel !== "custom") {
      document.getElementById("custom-od").value = npsODMap[sel];
    }
    calcFromClock();
  }

  function updateGraphicsAndLabels(deg, arcMm, totalPerim, hh, mm) {
    document.getElementById("lbl-deg").innerText = deg.toFixed(1) + "°";
    document.getElementById("lbl-arc").innerText = arcMm.toFixed(2) + " mm";
    document.getElementById("lbl-perim").innerText = totalPerim.toFixed(2) + " mm";

    const hhStr = String(Math.floor(hh)).padStart(2, '0');
    const mmStr = String(Math.floor(mm)).padStart(2, '0');
    document.getElementById("lbl-clock").innerText = `${hhStr}:${mmStr}`;

    const rad = (deg - 90) * (Math.PI / 180);
    const x2 = 130 + 82 * Math.cos(rad);
    const y2 = 130 + 82 * Math.sin(rad);

    const needle = document.getElementById("needle");
    needle.setAttribute("x2", x2);
    needle.setAttribute("y2", y2);
  }

  function calcFromClock() {
    const od = getOD();
    const perimeter = Math.PI * od;

    let hh = parseFloat(document.getElementById("hours").value) || 0;
    let mm = parseFloat(document.getElementById("minutes").value) || 0;

    let decHours = (hh % 12) + (mm / 60);
    let degrees = decHours * 30;
    let arc = (degrees / 360) * perimeter;

    document.getElementById("arc-input").value = arc.toFixed(2);
    updateGraphicsAndLabels(degrees, arc, perimeter, hh, mm);
  }

  function calcFromArc() {
    const od = getOD();
    const perimeter = Math.PI * od;
    let arc = parseFloat(document.getElementById("arc-input").value) || 0;

    if (perimeter <= 0) return;

    arc = arc % perimeter;
    if (arc < 0) arc += perimeter;

    let degrees = (arc / perimeter) * 360;
    let totalDecHours = (degrees / 30);

    let hours = Math.floor(totalDecHours);
    let minutes = Math.round((totalDecHours - hours) * 60);

    if (minutes === 60) {
      hours = (hours + 1) % 12;
      minutes = 0;
    }

    document.getElementById("hours").value = hours;
    document.getElementById("minutes").value = minutes;

    updateGraphicsAndLabels(degrees, arc, perimeter, hours, minutes);
  }

  // Funciones de incremento/decremento táctil
  function stepHour(delta) {
    let el = document.getElementById("hours");
    let val = (parseInt(el.value) || 0) + delta;
    if (val < 0) val = 11;
    if (val > 12) val = 1;
    el.value = val;
    calcFromClock();
  }

  function stepMin(delta) {
    let el = document.getElementById("minutes");
    let val = (parseInt(el.value) || 0) + delta;
    if (val < 0) val = 55;
    if (val >= 60) val = 0;
    el.value = val;
    calcFromClock();
  }

  function stepArc(delta) {
    let el = document.getElementById("arc-input");
    let val = (parseFloat(el.value) || 0) + delta;
    if (val < 0) val = 0;
    el.value = val.toFixed(1);
    calcFromArc();
  }

  function stepVal(id, delta, cb) {
    let el = document.getElementById(id);
    let val = (parseFloat(el.value) || 0) + delta;
    if (val < 0) val = 0;
    el.value = val.toFixed(1);
    if (cb) cb();
  }

  calcFromClock();
</script>

</body>
</html>
